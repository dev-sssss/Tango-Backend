name: Deploy Tango backend (SSM)

# Same model as dev-sssss/ludo_nakama-ansible:
#   - GitHub signs in to AWS with a short-lived OIDC role (no AWS keys)
#   - Ansible reaches the EC2 through AWS Systems Manager Session Manager
#     (no SSH port, no SSH key); files travel through the SSM transfer bucket
#   - the server is a static Go binary rolled onto two Compose nodes, one at a
#     time, so live matches move to the other node instead of being dropped
#
# Press "Run workflow":
#   1. Tests         go vet + all tests
#   2. Build         static binaries for amd64 and arm64
#   3. Deploy        verify the AWS target, run playbooks/deploy_tango.yml over SSM
#   4. Smoke test    health, sign-in and RPCs from the internet
#
# Target (account, instance, bucket, role) is reviewed in config/aws-targets.json.
# One-time AWS setup: iam/create-deploy-role.sh (see README).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where
        type: choice
        options: [nonprod]
        default: nonprod
      skip_tests:
        description: Skip the test job (urgent re-deploys only)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: tango-${{ inputs.environment }}-deployment
  cancel-in-progress: false

jobs:
  test:
    name: 1. Tests
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tango
          POSTGRES_PASSWORD: tango
          POSTGRES_DB: tango_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tango" --health-interval 2s --health-timeout 2s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - env:
          TANGO_TEST_DB: postgres://tango:tango@127.0.0.1:5432/tango_e2e?sslmode=disable
        run: go test -count=1 -timeout 15m ./...

  build:
    name: 2. Build server binaries
    needs: [test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - id: meta
        run: echo "release=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Static binaries
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../artifact
          pkg=github.com/dev-sssss/tango_backend/server/internal/server
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X $pkg.BuildVersion=${{ steps.meta.outputs.release }} -X $pkg.BuildTime=$(date +%s)" \
              -o ../artifact/tango-server-linux-$arch ./cmd/tango-server
          done
          sha256sum ../artifact/*
      - uses: actions/upload-artifact@v4
        with:
          name: tango-server-${{ steps.meta.outputs.release }}
          path: artifact/
          retention-days: 7

  deploy:
    name: 3. Deploy over SSM
    needs: [build]
    if: ${{ always() && needs.build.result == 'success' }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reviewed target
        id: target
        run: |
          t=$(jq -c '.["${{ inputs.environment }}"]' config/aws-targets.json)
          for k in account_id region deploy_role_arn; do echo "$k=$(echo "$t" | jq -r .$k)" >> "$GITHUB_OUTPUT"; done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.target.outputs.deploy_role_arn }}
          aws-region: ${{ steps.target.outputs.region }}
          allowed-account-ids: ${{ steps.target.outputs.account_id }}
          role-session-name: tango-deploy-${{ github.run_id }}
      - name: Verify account, instance and SSM
        id: check
        run: python3 scripts/check_aws_target.py --environment "${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ansible and the Session Manager plugin
        run: |
          pip install ansible-core==2.18.6 boto3 botocore
          ansible-galaxy collection install -r requirements.yml
          curl --fail --silent --show-error https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o /tmp/ssm.deb
          sudo dpkg -i /tmp/ssm.deb
      - uses: actions/download-artifact@v4
        with:
          name: tango-server-${{ needs.build.outputs.release }}
          path: artifact
      - name: Run the playbook
        env:
          AWS_REGION: ${{ steps.target.outputs.region }}
          SSM_TRANSFER_BUCKET: ${{ steps.check.outputs.transfer_bucket }}
          TANGO_RELEASE: ${{ needs.build.outputs.release }}
          TANGO_ARTIFACT_DIR: ${{ github.workspace }}/artifact
          TANGO_PUBLIC_HOST: ${{ vars.TANGO_DOMAIN || steps.check.outputs.public_ip }}
          TANGO_RESULT_FILE: ${{ runner.temp }}/tango-deploy-result.json
        run: ansible-playbook -i "inventories/${{ inputs.environment }}/hosts.yml" playbooks/deploy_tango.yml
      - name: Smoke test from the internet
        env:
          RESULT: ${{ runner.temp }}/tango-deploy-result.json
        run: |
          base=$(jq -r .base "$RESULT"); key=$(jq -r .server_key "$RESULT")
          echo "::add-mask::$key"
          bash deploy/scripts/smoke-test.sh "$base" "$key"
          hostport=${base#*://}; port=${hostport##*:}
          [ "$port" = "$hostport" ] && port=$([ "${base%%://*}" = https ] && echo 443 || echo 80)
          {
            echo "## Tango backend deployed (${{ inputs.environment }})"
            echo
            echo "| Unity / Nakama client setting | Value |"
            echo "|---|---|"
            echo "| Scheme | \`${base%%://*}\` |"
            echo "| Host | \`${hostport%%:*}\` |"
            echo "| Port | \`$port\` |"
            echo "| Server key | in \`$(jq -r .dir "$RESULT")/connection.txt\` on the server |"
            echo "| Health check | $base/healthcheck |"
            echo
            echo "Release \`$(jq -r .release "$RESULT")\` ($(jq -r .arch "$RESULT")) in \`$(jq -r .dir "$RESULT")\`"
          } >> "$GITHUB_STEP_SUMMARY"
