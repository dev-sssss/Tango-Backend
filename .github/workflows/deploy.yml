name: Deploy to EC2

# Press "Run workflow". One run:
#   1. tests the server
#   2. builds the server image (amd64 + arm64) and pushes it to GitHub
#      Container Registry (ghcr.io/dev-sssss/tango-backend)
#   3. connects to your EC2 over SSH, goes to your Tango folder and runs
#      deploy/scripts/deploy.sh there: writes docker-compose.yml + .env with
#      the new image and starts/updates the stack (Postgres, two game nodes,
#      nginx). Game nodes restart one at a time so no live match is cut off.
#      Other Docker Compose stacks on the server are not touched.
#   4. checks the server from outside (HTTPS, sign-in, RPCs)
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   EC2_HOST      the Elastic IP of the instance
#   EC2_USER      SSH user (ubuntu on Ubuntu, ec2-user on Amazon Linux)
#   EC2_SSH_KEY   the private key (.pem file contents) for that user
# Optional repository variables:
#   EC2_DEPLOY_PATH  the Tango folder on the server. If not set, the workflow
#                    uses the one folder named like "*tango*" in /root, the
#                    SSH user's home, /opt or /srv, or creates /root/tango-backend.
#   TANGO_DOMAIN     a domain pointing at the Elastic IP (otherwise the IP)
# Security group: 22 (SSH) and either 80+443 (if free on the server: HTTPS)
# or 8350 (used when 80/443 already belong to another stack: HTTP).

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the test job (only for urgent re-deploys)"
        type: boolean
        default: false

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dev-sssss/tango-backend

jobs:
  test:
    name: 1. Tests
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tango
          POSTGRES_PASSWORD: tango
          POSTGRES_DB: tango_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tango" --health-interval 2s --health-timeout 2s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - env:
          TANGO_TEST_DB: postgres://tango:tango@127.0.0.1:5432/tango_e2e?sslmode=disable
        run: go test -count=1 -timeout 15m ./...

  image:
    name: 2. Server image → ghcr.io
    needs: [test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "image=${IMAGE}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 3. Deploy on EC2 (Docker Compose)
    needs: [image]
    if: ${{ always() && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      TANGO_HOST: ${{ vars.TANGO_DOMAIN || secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          missing=""
          [ -n "$EC2_HOST" ] || missing="$missing EC2_HOST"
          [ -n "$EC2_USER" ] || missing="$missing EC2_USER"
          [ -n "$EC2_SSH_KEY" ] || missing="$missing EC2_SSH_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - name: SSH key
        run: |
          host=$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')
          user=$(printf '%s' "$EC2_USER" | tr -d '[:space:]')
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName $host
            User $user
            IdentityFile ~/.ssh/ec2.pem
            ServerAliveInterval 30
            ConnectTimeout 20
          EOF
          if ! ssh-keygen -y -f ~/.ssh/ec2.pem >/dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY is not a valid private key. Paste the whole .pem file, including the BEGIN and END lines."
            exit 1
          fi
          if ! timeout 15 bash -c "</dev/tcp/$host/22" 2>/dev/null; then
            echo "::error::GitHub cannot reach port 22 (SSH) on $host. In the EC2 security group, allow inbound SSH (port 22) from 0.0.0.0/0 (GitHub's servers use changing IPs), and check that EC2_HOST is only the Elastic IP."
            exit 1
          fi
          ssh-keyscan -T 15 -H "$host" >> ~/.ssh/known_hosts
          if ! ssh -o BatchMode=yes ec2 'echo "connected to $(hostname) ($(uname -m)) as $(whoami)"'; then
            echo "::error::SSH login refused. Check EC2_USER (usually ubuntu on Ubuntu, ec2-user on Amazon Linux) and that EC2_SSH_KEY is the key of this instance."
            exit 1
          fi
          if ! ssh ec2 'sudo -n true' 2>/dev/null; then
            echo "::error::User $user cannot use sudo without a password on the server."
            exit 1
          fi
      - name: Find or create the Tango folder on the server
        id: dir
        env:
          DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH }}
        run: |
          dir="$DEPLOY_PATH"
          if [ -z "$dir" ]; then
            found=$(ssh ec2 'sudo find /root "$HOME" /opt /srv -mindepth 1 -maxdepth 2 -type d -iname "*tango*" -not -path "*/.*" 2>/dev/null' | sort -u)
            n=$(printf '%s' "$found" | grep -c . || true)
            case "$n" in
              0) dir=/root/tango-backend; echo "No Tango folder yet: creating $dir" ;;
              1) dir=$found ;;
              *) echo "::error::Found more than one Tango folder:"; printf '%s\n' "$found"
                 echo "Set the repository variable EC2_DEPLOY_PATH to the one to use."; exit 1 ;;
            esac
          fi
          ssh ec2 "sudo mkdir -p '$dir'"
          echo "Deploying into $dir"
          echo "path=$dir" >> "$GITHUB_OUTPUT"
      - name: Upload deploy files
        run: |
          tar -czf /tmp/tango-deploy.tgz -C deploy .
          scp -q /tmp/tango-deploy.tgz ec2:/tmp/tango-deploy.tgz
          ssh ec2 'rm -rf /tmp/tango-deploy && mkdir -p /tmp/tango-deploy && tar -xzf /tmp/tango-deploy.tgz -C /tmp/tango-deploy && rm -f /tmp/tango-deploy.tgz'
      - name: Docker on the server
        run: ssh ec2 'sudo bash /tmp/tango-deploy/scripts/install-docker.sh'
      - name: Deploy
        env:
          TANGO_DIR: ${{ steps.dir.outputs.path }}
        run: |
          TANGO_HOST=$(printf '%s' "$TANGO_HOST" | tr -d '[:space:]')
          # Short-lived registry login kept in its own docker config dir, so
          # the server's normal docker login (other stacks) is not changed.
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh ec2 "sudo bash -c 'umask 077; rm -rf /tmp/tango-docker-cfg; mkdir -p /tmp/tango-docker-cfg; DOCKER_CONFIG=/tmp/tango-docker-cfg docker login ghcr.io -u ${{ github.actor }} --password-stdin'" >/dev/null
          ssh ec2 "sudo TANGO_IMAGE='${{ needs.image.outputs.image }}' TANGO_HOST='${TANGO_HOST}' TANGO_DIR='${TANGO_DIR}' TANGO_DOCKER_CONFIG=/tmp/tango-docker-cfg bash /tmp/tango-deploy/scripts/deploy.sh"
      - name: Remove the temporary registry login
        if: always()
        run: |
          [ -f ~/.ssh/config ] && ssh -o BatchMode=yes ec2 'sudo rm -rf /tmp/tango-docker-cfg /tmp/tango-deploy' 2>/dev/null || true
      - name: Smoke test from outside
        env:
          TANGO_DIR: ${{ steps.dir.outputs.path }}
        run: |
          TANGO_HOST=$(printf '%s' "$TANGO_HOST" | tr -d '[:space:]')
          key=$(ssh ec2 "sudo grep '^SERVER_KEY=' '${TANGO_DIR}/.env' | cut -d= -f2")
          base=$(ssh ec2 "sudo awk '/^  Base/{print \$3}' '${TANGO_DIR}/connection.txt'")
          scheme=${base%%://*}
          hostport=${base#*://}
          port=${hostport##*:}; [ "$port" = "$hostport" ] && port=$([ "$scheme" = https ] && echo 443 || echo 80)
          bash deploy/scripts/smoke-test.sh "$base" "$key"
          {
            echo "## Tango Cards server is live"
            echo
            echo "| Unity / Nakama client setting | Value |"
            echo "|---|---|"
            echo "| Scheme | \`${scheme}\` |"
            echo "| Host | \`${TANGO_HOST}\` |"
            echo "| Port | \`${port}\` |"
            echo "| Server key | \`${key}\` |"
            echo "| Health check | ${base}/healthcheck |"
            echo "| Folder on server | \`${TANGO_DIR}\` |"
            echo
            echo "Image: \`${{ needs.image.outputs.image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
