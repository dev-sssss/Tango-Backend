name: Deploy nonprod

# Press "Run workflow" in GitHub Actions. One run does everything:
#   1. tests             - the server must pass before anything changes
#   2. infrastructure    - Terraform creates/updates the EC2 server, network,
#                          ECR, S3 and secrets (state kept in S3)
#   3. image             - builds the arm64 server image and pushes it to ECR
#   4. configure+deploy  - runs the Ansible playbook on the server through AWS
#                          SSM: Docker, Postgres, two game nodes, nginx + TLS,
#                          backups; game nodes restart one at a time so no live
#                          match is interrupted
#   5. smoke test        - HTTPS health check and a real sign-in + RPC
#
# AWS access (set once by scripts/setup-github.ps1):
#   repository variable AWS_ROLE_ARN (GitHub OIDC role)  - preferred, or
#   secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# Optional repository variables: AWS_REGION (default ap-south-1),
#   TANGO_DOMAIN + TANGO_ROUTE53_ZONE_ID (own hostname instead of the bare IP).

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the test job (only for urgent re-deploys)"
        type: boolean
        default: false
      plan_only:
        description: "Only show the Terraform plan; change nothing"
        type: boolean
        default: false

concurrency:
  group: deploy-nonprod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_VAR_domain_name: ${{ vars.TANGO_DOMAIN || '' }}
  TF_VAR_route53_zone_id: ${{ vars.TANGO_ROUTE53_ZONE_ID || '' }}

jobs:
  test:
    name: 1. Tests
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tango
          POSTGRES_PASSWORD: tango
          POSTGRES_DB: tango_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tango" --health-interval 2s --health-timeout 2s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - env:
          TANGO_TEST_DB: postgres://tango:tango@127.0.0.1:5432/tango_e2e?sslmode=disable
        run: go test -count=1 -timeout 15m ./...

  infra:
    name: 2. Infrastructure (Terraform)
    needs: [test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      instance_id: ${{ steps.out.outputs.instance_id }}
      hostname: ${{ steps.out.outputs.hostname }}
      ecr_repository_url: ${{ steps.out.outputs.ecr_repository_url }}
      ops_bucket: ${{ steps.out.outputs.ops_bucket }}
      param_path: ${{ steps.out.outputs.param_path }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tango-deploy-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: State bucket (created on the first run)
        id: state
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="tango-tfstate-${ACCOUNT}-${AWS_REGION}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api wait bucket-exists --bucket "$BUCKET"
          fi
          aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
          aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
      - run: terraform init -backend-config="bucket=${{ steps.state.outputs.bucket }}" -backend-config="key=tango/nonprod/terraform.tfstate" -backend-config="region=${AWS_REGION}"
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - name: Apply
        if: ${{ !inputs.plan_only }}
        run: terraform apply -auto-approve tfplan
      - name: Outputs
        id: out
        if: ${{ !inputs.plan_only }}
        run: |
          set -euo pipefail
          for k in instance_id hostname ecr_repository_url ops_bucket param_path; do
            echo "$k=$(terraform output -raw $k)" >> "$GITHUB_OUTPUT"
          done

  image:
    name: 3. Server image (arm64 → ECR)
    needs: [infra]
    if: ${{ always() && needs.infra.result == 'success' && !inputs.plan_only }}
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: |
          echo "image=${{ needs.infra.outputs.ecr_repository_url }}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ needs.infra.outputs.ecr_repository_url }}:nonprod
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 4. Configure server and deploy (Ansible via SSM)
    needs: [infra, image]
    if: ${{ always() && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run Ansible on the server
        env:
          INSTANCE_ID: ${{ needs.infra.outputs.instance_id }}
          HOSTNAME_PUBLIC: ${{ needs.infra.outputs.hostname }}
          OPS_BUCKET: ${{ needs.infra.outputs.ops_bucket }}
          PARAM_PATH: ${{ needs.infra.outputs.param_path }}
          ECR_URL: ${{ needs.infra.outputs.ecr_repository_url }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: bash scripts/ssm-ansible.sh
      - name: Smoke test (HTTPS health, sign-in, RPC)
        env:
          HOSTNAME_PUBLIC: ${{ needs.infra.outputs.hostname }}
          PARAM_PATH: ${{ needs.infra.outputs.param_path }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: bash scripts/smoke-test.sh
