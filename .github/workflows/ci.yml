name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests (unit, rules, cluster e2e)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tango
          POSTGRES_PASSWORD: tango
          POSTGRES_DB: tango_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tango" --health-interval 2s --health-timeout 2s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Tests (rules engine, match handler, RPCs, engine, real-process cluster)
        env:
          TANGO_TEST_DB: postgres://tango:tango@127.0.0.1:5432/tango_e2e?sslmode=disable
        run: go test -count=1 -timeout 15m ./...

  compose:
    name: Ansible + Docker Compose deploy (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # free-ports: a clean server (Tango gets 80/443).
        # shared-server: like the nonprod EC2 - other containers already use
        # 80, 443 and 7350, the server has its own docker login and images,
        # and the Tango folder already holds another compose file.
        scenario: [free-ports, shared-server]
    env:
      TANGO_DIR: /opt/tango-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Script checks
        run: |
          bash -n deploy/scripts/*.sh iam/*.sh
          shellcheck -S warning deploy/scripts/*.sh iam/*.sh ci/*.sh
          python3 -m py_compile scripts/check_aws_target.py
      - name: Ansible
        run: |
          pip install ansible-core==2.18.6 boto3
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i inventories/nonprod/hosts.yml playbooks/deploy_tango.yml --syntax-check
      - name: Existing stack on the server
        if: matrix.scenario == 'shared-server'
        run: |
          # Like the shared Ludo nginx: owns 443/7350, binds port 80 on the
          # private IP only (not loopback) and serves the Let's Encrypt
          # webroot /opt/ludo-acme for every host name.
          sudo mkdir -p /opt/ludo-acme
          ip=$(hostname -I | awk '{print $1}'); echo "PRIVATE_IP=$ip" >> "$GITHUB_ENV"
          docker run -d --name existing-proxy -p "$ip:80:80" -p 443:80 -p 7350:80 \
            -v /opt/ludo-acme:/usr/share/nginx/html:ro nginx:alpine
          docker pull -q busybox:latest
          sudo mkdir -p /root/.docker
          echo '{"auths":{"ghcr.io":{"auth":"ZXhpc3Rpbmc6bG9naW4="}}}' | sudo tee /root/.docker/config.json >/dev/null
          sudo sha256sum /root/.docker/config.json > /tmp/docker-config.sha
          sudo mkdir -p "$TANGO_DIR"
          printf 'services:\n  something: {image: busybox}\n' | sudo tee "$TANGO_DIR/docker-compose.yml" >/dev/null
      - name: Build release ci-release-1
        run: |
          mkdir -p artifact
          (cd server && CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/dev-sssss/tango_backend/server/internal/server.BuildTime=$(date +%s)" -o ../artifact/tango-server-linux-amd64 ./cmd/tango-server)
      - name: First deploy (the same playbook, run locally instead of over SSM)
        run: |
          TANGO_RELEASE=ci-release-1 TANGO_ARTIFACT_DIR=$PWD/artifact TANGO_PUBLIC_HOST=127.0.0.1 TANGO_TLS=off TANGO_RESULT_FILE=/tmp/result.json \
            ansible-playbook -i ci/local-inventory.ini -e tango_dir=$TANGO_DIR -e environment_name=nonprod -e tango_allow_cheats=true \
            playbooks/deploy_tango.yml
      - name: Smoke test
        run: |
          base=$(jq -r .base /tmp/result.json); echo "base=$base"
          if [ "${{ matrix.scenario }}" = shared-server ]; then [ "$base" = "http://127.0.0.1:8350" ]; else [ "$base" = "http://127.0.0.1" ]; fi
          bash deploy/scripts/smoke-test.sh "$base" "$(jq -r .server_key /tmp/result.json)"
      - name: Rolling update to release ci-release-2
        run: |
          (cd server && CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/dev-sssss/tango_backend/server/internal/server.BuildTime=$(date +%s)" -o ../artifact/tango-server-linux-amd64 ./cmd/tango-server)
          TANGO_RELEASE=ci-release-2 TANGO_ARTIFACT_DIR=$PWD/artifact TANGO_PUBLIC_HOST=127.0.0.1 TANGO_TLS=off TANGO_RESULT_FILE=/tmp/result.json \
            ansible-playbook -i ci/local-inventory.ini -e tango_dir=$TANGO_DIR -e environment_name=nonprod -e tango_allow_cheats=true \
            playbooks/deploy_tango.yml
          for n in 1 2; do
            docker inspect --format '{{range .Mounts}}{{.Source}} {{end}}' tango-backend-tango-node$n-1 | grep -q "$TANGO_DIR/releases/ci-release-2"
          done
          bash deploy/scripts/smoke-test.sh "$(jq -r .base /tmp/result.json)" "$(jq -r .server_key /tmp/result.json)"
      - name: Other stacks were not touched
        if: matrix.scenario == 'shared-server'
        run: |
          docker ps --filter name=existing-proxy --filter status=running -q | grep -q .
          curl -sS -o /dev/null "http://$PRIVATE_IP:80/"   # still answering (empty webroot gives 403)
          docker image inspect busybox:latest >/dev/null
          sudo sha256sum -c /tmp/docker-config.sha
          sudo ls "$TANGO_DIR"/docker-compose.yml.bak-*
      - name: HTTPS through the host certbot - DNS record missing (stays on HTTP)
        if: matrix.scenario == 'shared-server'
        run: |
          sudo install -m 0755 ci/fake-certbot.sh /usr/local/bin/certbot
          TANGO_RELEASE=ci-release-2 TANGO_ARTIFACT_DIR=$PWD/artifact TANGO_PUBLIC_HOST=tango-nodns.example.test TANGO_PUBLIC_IP=127.0.0.1 TANGO_RESULT_FILE=/tmp/result.json \
            ansible-playbook -i ci/local-inventory.ini -e tango_dir=$TANGO_DIR -e environment_name=nonprod -e tango_allow_cheats=true \
            -e tango_acme_webroot=/opt/ludo-acme playbooks/deploy_tango.yml
          [ "$(jq -r .base /tmp/result.json)" = "http://127.0.0.1:8350" ]
          bash deploy/scripts/smoke-test.sh "$(jq -r .base /tmp/result.json)" "$(jq -r .server_key /tmp/result.json)"
      - name: HTTPS through the host certbot - DNS record in place
        if: matrix.scenario == 'shared-server'
        run: |
          echo "$PRIVATE_IP tango-ci.example.test" | sudo tee -a /etc/hosts
          TANGO_RELEASE=ci-release-2 TANGO_ARTIFACT_DIR=$PWD/artifact TANGO_PUBLIC_HOST=tango-ci.example.test TANGO_PUBLIC_IP=$PRIVATE_IP TANGO_RESULT_FILE=/tmp/result.json \
            ansible-playbook -i ci/local-inventory.ini -e tango_dir=$TANGO_DIR -e environment_name=nonprod -e tango_allow_cheats=true \
            -e tango_acme_webroot=/opt/ludo-acme playbooks/deploy_tango.yml
          base=$(jq -r .base /tmp/result.json); echo "base=$base"
          [ "$base" = "https://tango-ci.example.test:8443" ]
          SMOKE_INSECURE=1 bash deploy/scripts/smoke-test.sh "$base" "$(jq -r .server_key /tmp/result.json)"
          # existing clients on plain HTTP keep working
          curl -fsS http://127.0.0.1:8350/healthcheck >/dev/null
          # the shared webroot is left clean
          [ -z "$(sudo find /opt/ludo-acme -type f)" ]
          # renewal: certbot runs the deploy hook, Tango's nginx serves the new certificate
          serial() { echo | openssl s_client -connect 127.0.0.1:8443 -servername tango-ci.example.test 2>/dev/null | openssl x509 -noout -serial; }
          before=$(serial)
          sudo FORCE_RENEWAL=1 certbot certonly --webroot -w /opt/ludo-acme -d tango-ci.example.test \
            --cert-name tango-ci.example.test --deploy-hook "$TANGO_DIR/bin/sync-cert.sh"
          sleep 2; after=$(serial)
          echo "$before -> $after"; [ "$before" != "$after" ]
          # a later deploy keeps HTTPS without issuing again
          TANGO_RELEASE=ci-release-2 TANGO_ARTIFACT_DIR=$PWD/artifact TANGO_PUBLIC_HOST=tango-ci.example.test TANGO_PUBLIC_IP=$PRIVATE_IP TANGO_RESULT_FILE=/tmp/result.json \
            ansible-playbook -i ci/local-inventory.ini -e tango_dir=$TANGO_DIR -e environment_name=nonprod -e tango_allow_cheats=true \
            -e tango_acme_webroot=/opt/ludo-acme playbooks/deploy_tango.yml
          [ "$(jq -r .base /tmp/result.json)" = "https://tango-ci.example.test:8443" ]
          [ "$(serial)" = "$after" ]
      - name: Backup script
        run: sudo TANGO_DIR="$TANGO_DIR" "$TANGO_DIR/bin/backup.sh" && sudo ls -l "$TANGO_DIR/backups"
      - name: Logs on failure
        if: failure()
        run: |
          sudo docker compose --project-directory "$TANGO_DIR" logs --tail 100 || true
          sudo grep -E '^(HTTP_PORT|HTTPS_PORT)=' "$TANGO_DIR/.env" || true
          sudo grep -nE 'listen|ssl_' "$TANGO_DIR/nginx/nginx.conf" || true
          sudo ls -la "$TANGO_DIR/certs" || true
          docker ps --format '{{.Names}} {{.Ports}}' || true
          sudo docker compose --project-directory "$TANGO_DIR" exec -T nginx nginx -t || true
          sudo docker compose --project-directory "$TANGO_DIR" exec -T nginx ls -la /etc/tango-certs || true
          curl -vk --max-time 5 https://127.0.0.1:8443/healthcheck || true

  image:
    name: Multi-arch image build (not pushed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
