name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests (unit, rules, cluster e2e)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tango
          POSTGRES_PASSWORD: tango
          POSTGRES_DB: tango_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tango" --health-interval 2s --health-timeout 2s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Tests (rules engine, match handler, RPCs, engine, real-process cluster)
        env:
          TANGO_TEST_DB: postgres://tango:tango@127.0.0.1:5432/tango_e2e?sslmode=disable
        run: go test -count=1 -timeout 15m ./...

  compose:
    name: Docker Compose stack (deploy script, nginx, rolling update)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Script checks
        run: |
          bash -n deploy/scripts/*.sh
          shellcheck -S warning deploy/scripts/*.sh
      - name: Build the server image
        run: docker build -t tango-local:ci1 --build-arg BUILD_TIME=$(date +%s) server
      - name: First deploy (what the EC2 deploy runs)
        run: sudo TANGO_IMAGE=tango-local:ci1 TANGO_HOST=127.0.0.1 TANGO_TLS=off TANGO_PULL=0 bash deploy/scripts/deploy.sh
      - name: Smoke test
        run: bash deploy/scripts/smoke-test.sh http://127.0.0.1 "$(sudo grep '^SERVER_KEY=' /opt/tango/.env | cut -d= -f2)"
      - name: Rolling update to a new image
        run: |
          docker build -t tango-local:ci2 --build-arg BUILD_TIME=$(date +%s) server
          sudo TANGO_IMAGE=tango-local:ci2 TANGO_HOST=127.0.0.1 TANGO_TLS=off TANGO_PULL=0 bash deploy/scripts/deploy.sh
          docker inspect --format '{{.Config.Image}}' tango-tango-node1-1 tango-tango-node2-1 | grep -c ci2 | grep -q 2
          bash deploy/scripts/smoke-test.sh http://127.0.0.1 "$(sudo grep '^SERVER_KEY=' /opt/tango/.env | cut -d= -f2)"
      - name: Backup script
        run: sudo TANGO_DIR=/opt/tango /opt/tango/bin/backup.sh && sudo ls -l /opt/tango/backups
      - name: Logs on failure
        if: failure()
        run: sudo docker compose --project-directory /opt/tango logs --tail 100 || true

  image:
    name: Multi-arch image build (not pushed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
