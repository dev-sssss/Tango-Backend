name: Destroy nonprod

# Deletes the whole non-prod stack (server, database, backups, images) to
# stop all AWS charges. Type the confirmation text exactly.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-nonprod" to delete everything'
        required: true
        type: string

concurrency:
  group: deploy-nonprod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_VAR_domain_name: ${{ vars.TANGO_DOMAIN || '' }}
  TF_VAR_route53_zone_id: ${{ vars.TANGO_ROUTE53_ZONE_ID || '' }}

jobs:
  destroy:
    if: ${{ inputs.confirm == 'destroy-nonprod' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          terraform init -backend-config="bucket=tango-tfstate-${ACCOUNT}-${AWS_REGION}" -backend-config="key=tango/nonprod/terraform.tfstate" -backend-config="region=${AWS_REGION}"
      - run: terraform destroy -auto-approve
