# Ansible talks to the instance over AWS SSM Session Manager; files travel
# through the SSM transfer bucket (one-day expiry). No SSH port is needed.
ansible_connection: amazon.aws.aws_ssm
ansible_aws_ssm_region: ap-south-1
ansible_aws_ssm_bucket_name: "{{ lookup('env', 'SSM_TRANSFER_BUCKET') }}"
ansible_aws_ssm_bucket_sse_mode: AES256
ansible_become: true
environment_name: nonprod
tango_dir: /opt/tango-server
# Dev shortcut RPC (+10,000 coins); never enabled in production.
tango_allow_cheats: true
