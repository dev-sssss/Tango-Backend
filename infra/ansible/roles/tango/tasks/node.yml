# Recreate one game node if its image or config changed, then wait until it
# is healthy before the next one goes.
- name: "{{ tango_node.name }}: image currently running"
  ansible.builtin.command: docker inspect --format '{{ '{{' }}.Config.Image{{ '}}' }}' tango-tango-{{ tango_node.name }}-1
  register: running
  changed_when: false
  failed_when: false

- name: "{{ tango_node.name }}: start or replace"
  ansible.builtin.command: >
    docker compose --project-directory {{ tango_dir }} up -d --no-deps
    {{ '--force-recreate' if node_config.changed and running.rc == 0 else '' }} tango-{{ tango_node.name }}
  register: up
  changed_when: "'Recreated' in up.stderr or 'Started' in up.stderr or 'Created' in up.stderr"

- name: "{{ tango_node.name }}: remember that nodes changed"
  ansible.builtin.set_fact:
    nodes_changed: true
  when: up.changed

- name: "{{ tango_node.name }}: wait until healthy"
  ansible.builtin.command: "{{ tango_dir }}/bin/wait_node.sh {{ tango_node.admin_port }} 120"
  changed_when: false
